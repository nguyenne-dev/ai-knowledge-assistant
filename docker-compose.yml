version: '3.8'

services:
  # Vector Database Service
  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatbot-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_TLS=false

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot-backend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./knowledge:/app/knowledge:ro
    env_file:
      - ./backend/.env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - LLM_PROVIDER=gemini
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=tech_fashion_knowledge
    depends_on:
      - qdrant

  # Frontend Web UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatbot-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  qdrant_storage:
